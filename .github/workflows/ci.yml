name: Backend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run tests
      run: ./mvnw test -Dspring.profiles.active=test
      continue-on-error: false

    - name: Build application  
      run: ./mvnw clean package -DskipTests

    - name: Run integration tests
      run: ./mvnw verify -DskipUTs=true
      continue-on-error: true

    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests
        path: target/surefire-reports/*.xml
        reporter: java-junit

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          target/surefire-reports/
          target/site/jacoco/

    - name: Check code coverage
      run: ./mvnw jacoco:report

    - name: Comment PR with test results
      if: github.event_name == 'pull_request' && (success() || failure())
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          try {
            const testStatus = '${{ job.status }}' === 'success' ? '✅ Passed' : '❌ Failed';
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🧪 Backend Test Results
              
              **Status**: ${testStatus}
              **Commit**: ${context.sha.substring(0, 7)}
              
              View detailed test results in the [Actions tab](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
            });
          } catch (error) {
            console.log('Failed to comment on PR:', error.message);
            console.log('This is non-critical and the workflow will continue.');
          }
