name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: expensia-471415
  SERVICE_NAME: expensia-backend
  REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/expensia-471415/expensia
  GOOGLE_CLIENT_ID: 979056550483-1kjqo37ee1pif4r8jehgu9sgmj43pq3k.apps.googleusercontent.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build with Maven (skip tests for deployment)
      run: ./mvnw clean package -DskipTests

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Configure Docker to use Artifact Registry
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Build and Push Docker image
      run: |
        # Build the image
        docker build -t $ARTIFACT_REGISTRY/$SERVICE_NAME:$GITHUB_SHA .
        docker tag $ARTIFACT_REGISTRY/$SERVICE_NAME:$GITHUB_SHA $ARTIFACT_REGISTRY/$SERVICE_NAME:latest
        
        # Push the images
        docker push $ARTIFACT_REGISTRY/$SERVICE_NAME:$GITHUB_SHA
        docker push $ARTIFACT_REGISTRY/$SERVICE_NAME:latest

    - name: Deploy to Cloud Run (Preview)
      if: github.event_name == 'pull_request'
      run: |
        gcloud run deploy $SERVICE_NAME-pr-${{ github.event.number }} \
          --image $ARTIFACT_REGISTRY/$SERVICE_NAME:$GITHUB_SHA \
          --region $REGION \
          --platform managed \
          --allow-unauthenticated \
          --set-secrets="MONGODB_URI=mongodb-uri:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,JWT_SECRET=jwt-secret:latest" \
          --set-env-vars="GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }},JWT_ACCESS_EXP=3600000,JWT_REFRESH_EXP=604800000,OAUTH2_REDIRECT_URIS=https://expensia.live/auth/callback,GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},APP_CORS_ALLOWED_ORIGINS=https://expensia.live,FRONTEND_BASE_URL=https://expensia.live,APP_BASE_URL=https://$SERVICE_NAME-pr-${{ github.event.number }}-$PROJECT_ID.$REGION.run.app" \
          --vpc-connector run-connector \
          --vpc-egress all-traffic \
          --memory 2Gi \
          --cpu 2 \
          --min-instances 0 \
          --max-instances 10 \
          --timeout 900 \
          --port 8080 \
          --tag pr-${{ github.event.number }}

    - name: Deploy to Cloud Run (Production)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        gcloud run deploy $SERVICE_NAME \
          --image $ARTIFACT_REGISTRY/$SERVICE_NAME:$GITHUB_SHA \
          --region $REGION \
          --platform managed \
          --allow-unauthenticated \
          --set-secrets="MONGODB_URI=mongodb-uri:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,JWT_SECRET=jwt-secret:latest" \
          --set-env-vars="GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }},JWT_ACCESS_EXP=3600000,JWT_REFRESH_EXP=604800000,OAUTH2_REDIRECT_URIS=https://expensia.live/auth/callback,GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},APP_CORS_ALLOWED_ORIGINS=https://expensia.live,APP_BASE_URL=https://$SERVICE_NAME-$PROJECT_ID.$REGION.run.app,FRONTEND_BASE_URL=https://expensia.live" \
          --vpc-connector run-connector \
          --vpc-egress all-traffic \
          --memory 2Gi \
          --cpu 2 \
          --min-instances 0 \
          --max-instances 100 \
          --timeout 900 \
          --port 8080

    - name: Health Check
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        sleep 30
        curl -f https://$SERVICE_NAME-$PROJECT_ID.$REGION.run.app/api/health || exit 1
        echo "✅ Deployment successful and health check passed"

    - name: Clean up old preview deployments
      if: github.event_name == 'pull_request'
      run: |
        # Clean up preview deployments older than 7 days
        gcloud run services list --region=$REGION --filter="metadata.name~'$SERVICE_NAME-pr-'" --format="value(metadata.name,metadata.creationTimestamp)" | \
        while IFS=$'\t' read -r name timestamp; do
          if [[ $(date -d "$timestamp" +%s) -lt $(date -d "7 days ago" +%s) ]]; then
            echo "Deleting old preview deployment: $name"
            gcloud run services delete $name --region=$REGION --quiet || true
          fi
        done

    - name: Comment PR with deployment info
      if: github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          try {
            const serviceName = '${{ env.SERVICE_NAME }}-pr-${{ github.event.number }}';
            const region = '${{ env.REGION }}';
            const projectId = '${{ env.PROJECT_ID }}';
            const deploymentUrl = `https://${serviceName}-${projectId}.${region}.run.app`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Backend Preview Deployment Ready**
              
              **Preview URL**: ${deploymentUrl}
              **Health Check**: ${deploymentUrl}/api/health
              
              This preview deployment will be automatically cleaned up when the PR is closed or after 7 days.`
            });
          } catch (error) {
            console.log('Failed to comment on PR:', error.message);
            console.log('This is non-critical and the workflow will continue.');
          }