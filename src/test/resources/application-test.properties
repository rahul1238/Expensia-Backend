# Test Configuration

# Disable problematic auto-configurations
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

# Use in-memory data for tests
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=test

# Mock OAuth2 settings
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# Mock environment variables
GOOGLE_CLIENT_ID=test-client-id
GOOGLE_CLIENT_SECRET=test-client-secret
JWT_SECRET=dGVzdC1qd3Qtc2VjcmV0LWZvci10ZXN0aW5nLW9ubHkta2V5
JWT_ACCESS_EXP=3600000
JWT_REFRESH_EXP=604800000
GEMINI_API_KEY=test-api-key
OAUTH2_REDIRECT_URIS=http://localhost:3000/auth/callback
APP_CORS_ALLOWED_ORIGINS=http://localhost:3000
APP_BASE_URL=http://localhost:8080
FRONTEND_BASE_URL=http://localhost:3000

# Logging for tests
logging.level.com.expensia=INFO
logging.level.org.springframework=WARN
logging.level.org.mongodb=ERROR